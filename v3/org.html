<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>机构端</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding-bottom:72px}.h{background:#0d47a1;color:#fff;text-align:center;padding:14px;font-weight:700}.card{background:#fff;border-radius:14px;padding:14px;margin:12px}button{border:none;border-radius:10px;padding:10px;background:#0d47a1;color:#fff;margin-top:8px}input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:10px}.tab{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff}.tab button{flex:1;background:none;color:#888;margin:0}.tab button.on{color:#0d47a1;font-weight:700}.big{font-size:26px;font-weight:800}.note{color:#666;font-size:13px;margin-top:6px}</style></head>
<body><div class="h">机构端 · 站长</div><div id="app"></div>
<div class="tab"><button class="on" onclick="tab('orders',this)">待核对</button><button onclick="tab('pay',this)">收款</button><button onclick="tab('payout',this)">发放</button><button onclick="tab('add',this)">录入</button></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
firebase.initializeApp(window.FIREBASE_CONFIG); var db=firebase.database();
var view='orders', orders={}, caregivers={};
function tab(v,el){view=v;document.querySelectorAll('.tab button').forEach(function(b){b.classList.remove('on');});el.classList.add('on');render();}
function done(id){db.ref('v3/orders/'+id).update({status:'done',confirmed_at:Date.now()});}
function paid(id){db.ref('v3/orders/'+id).update({paid:true,paid_at:Date.now()});}
function payout(id){db.ref('v3/orders/'+id).update({payout:'paid',payout_at:Date.now()});}
function addPatient(){var name=document.getElementById('n').value||'患者';var phone=document.getElementById('p').value.replace(/\s/g,'');if(!phone)return alert('请填电话');db.ref('v3/patients/'+phone).set({name:name,phone:phone,address:document.getElementById('a').value||''});alert('患者已录入');}
function addCaregiver(){var name=document.getElementById('cn').value||'护理员';var phone=document.getElementById('cp').value.replace(/\s/g,'');if(!phone)return alert('请填护理员手机号');db.ref('v3/caregivers/'+phone).set({name:name,phone:phone});alert('护理员已录入，可用这个手机号登录');}
function render(){var list=Object.keys(orders).map(function(k){return orders[k];});var html='';
if(view==='orders'){var wait=list.filter(function(o){return o.status==='reported';});html=wait.map(function(o){return '<div class="card"><div class="big">'+o.patient+' '+o.service+'</div><div class="note">'+(o.caregiver||'')+' 已拍照并出示收款码。</div><button onclick="done(\''+o.id+'\')">照片对上了，确认完成</button></div>';}).join('')||'<div class="card">没有待核对的单</div>';}
if(view==='pay') html=list.filter(function(o){return o.status==='reported'||o.status==='done';}).map(function(o){return '<div class="card"><b>'+o.patient+' · '+o.service+'</b><div>实收 ¥'+(o.fee||0)+' · '+(o.paid?'已支付':'待收款')+'</div>'+(o.paid?'':'<button onclick="paid(\''+o.id+'\')">微信已入账，标记已支付</button>')+'</div>';}).join('')||'<div class="card">没有待收款的单</div>';
if(view==='payout') html=list.filter(function(o){return o.status==='done';}).map(function(o){return '<div class="card"><b>'+(o.caregiver||'未分配')+'</b><div>'+o.patient+' · '+o.service+' · 提成 ¥'+(o.commission||0)+'</div><div>'+(o.payout==='paid'?'已发放':'待发放')+'</div>'+(o.payout==='paid'?'':'<button onclick="payout(\''+o.id+'\')">标记已发放</button>')+'</div>';}).join('')||'<div class="card">没有可发放的单</div>';
if(view==='add'){var cg=Object.keys(caregivers).map(function(k){return caregivers[k].name+' · '+caregivers[k].phone;}).join('<br>')||'还没有护理员';html='<div class="card"><b>录入护理员</b><input id="cn" placeholder="姓名"><input id="cp" placeholder="手机号"><button onclick="addCaregiver()">保存护理员</button><p class="note">'+cg+'</p></div><div class="card"><b>录入患者</b><input id="n" placeholder="姓名"><input id="p" placeholder="电话"><input id="a" placeholder="地址"><button onclick="addPatient()">保存患者</button></div>';}
document.getElementById('app').innerHTML=html;}
db.ref('v3/orders').on('value',function(s){orders=s.val()||{};render();});
db.ref('v3/caregivers').on('value',function(s){caregivers=s.val()||{};if(view==='add') render();});
</script></body></html>
