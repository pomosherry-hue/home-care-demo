<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>护理员端</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding-bottom:72px}.h{background:#1b5e20;color:#fff;text-align:center;padding:14px;font-weight:700}.card{background:#fff;border-radius:14px;padding:14px;margin:12px}button{border:none;border-radius:10px;padding:12px;background:#2e7d32;color:#fff;width:100%;margin-top:8px}img.shot{width:100%;border-radius:12px;margin-top:8px}img.qr{width:200px;height:200px;display:block;margin:10px auto}.tab{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff}.tab button{flex:1;background:none;color:#888;width:auto;margin:0}.tab button.on{color:#1b5e20;font-weight:700}.note{color:#666;font-size:14px;margin-top:6px}.big{font-size:28px;font-weight:800;line-height:1.3}.fee{font-size:22px;color:#c62828;font-weight:800;text-align:center;margin-top:6px}</style></head>
<body><div class="h">护理员端</div><div id="app"></div>
<input id="cam" type="file" accept="image/*" capture="environment" style="display:none">
<div class="tab"><button class="on" id="t1" onclick="tab('pool',this)">抢单</button><button id="t2" onclick="tab('mine',this)">我的单</button><button id="t3" onclick="tab('income',this)">收入</button></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
firebase.initializeApp(window.FIREBASE_CONFIG); var db=firebase.database();
var me=localStorage.getItem('v3cg')||'', view='pool', orders={}, pendingId='', lastFile=null, shareText='';
if(!me){me=prompt('护理员姓名','小周')||'护理员';localStorage.setItem('v3cg',me);}
function tab(v,el){view=v;document.querySelectorAll('.tab button').forEach(function(b){b.classList.remove('on');});el.classList.add('on');render();}
function grab(id){db.ref('v3/orders/'+id).update({status:'doing',caregiver:me,grabbed_at:Date.now()});}
function finish(id){pendingId=id;document.getElementById('cam').click();}
document.getElementById('cam').onchange=function(e){
  var f=e.target.files&&e.target.files[0]; if(!f||!pendingId) return;
  lastFile=f; var id=pendingId; var url=URL.createObjectURL(f);
  var o=orders[id]||{}; var fee=o.fee||80;
  shareText=(o.patient||'')+' '+(o.service||'')+' 已完成，请支付 '+fee+'元。收款码在患者端。';
  db.ref('v3/orders/'+id).update({status:'reported',photo:true,reported_at:Date.now(),check_text:(o.patient||'')+' '+(o.service||''),fee:fee});
  document.getElementById('app').innerHTML='<div class="card"><div class="big">'+(o.patient||'')+' '+(o.service||'')+'</div><div class="fee">¥'+fee+'</div><img class="qr" src="pay-code.svg" alt="收款码"><p class="note">收款码已同时发到患者端。照片仍留在这里，可分享给站长。</p><img class="shot" src="'+url+'"><button onclick="sharePhoto()">把完成照片分享到微信</button><button onclick="tab(\'mine\',document.getElementById(\'t2\'))">返回我的单</button></div>';
  e.target.value='';
};
function sharePhoto(){if(navigator.share&&lastFile){navigator.share({files:[lastFile],title:shareText,text:shareText}).catch(function(){});}else alert('照片请截图发给站长。收款码请让患者打开患者端。');}
function render(){var list=Object.keys(orders).map(function(k){return orders[k];});var html='';
if(view==='pool'){html=list.filter(function(o){return o.status==='open';}).map(function(o){return '<div class="card"><b>'+o.patient+' · '+o.service+'</b><div>'+o.phone+' · ¥'+(o.fee||0)+'</div><button onclick="grab(\''+o.id+'\')">抢单</button></div>';}).join('')||'<div class="card">暂无可抢单</div>';}
if(view==='mine'){html=list.filter(function(o){return o.caregiver===me;}).map(function(o){var s=o.status==='doing'?'服务中':o.status==='reported'?'已出示收款码':o.status==='done'?'站长已确认':'';return '<div class="card"><b>'+o.patient+' · '+o.service+'</b><div>'+s+(o.paid?' · 已付':'')+'</div>'+(o.status==='doing'?'<button onclick="finish(\''+o.id+'\')">服务完成</button>':'')+'</div>';}).join('')||'<div class="card">还没有抢到的单</div>';}
if(view==='income'){var mine=list.filter(function(o){return o.caregiver===me&&o.status==='done';});var sum=mine.reduce(function(s,o){return s+(o.commission||0);},0);html='<div class="card"><b>应结 ¥'+sum+'</b><div>提成按实收的三成，等发放日</div></div>'+mine.map(function(o){return '<div class="card">'+o.patient+' · '+o.service+' · ¥'+(o.commission||0)+'<div>'+(o.payout==='paid'?'已发放':'待发放')+'</div></div>';}).join('');}
document.getElementById('app').innerHTML=html;}
db.ref('v3/orders').on('value',function(s){orders=s.val()||{};if(!lastFile) render();});
</script></body></html>
