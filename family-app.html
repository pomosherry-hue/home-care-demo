<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>居家介护 - 家属端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; padding-bottom: 70px; }
    .header { background: #1976d2; color: white; padding: 16px; text-align: center; font-size: 18px; font-weight: 600; }
    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #eee; }
    .tab { flex: 1; text-align: center; padding: 10px 0; font-size: 12px; color: #888; background: none; border: none; }
    .tab.active { color: #1976d2; font-weight: 600; }
    .screen { display: none; padding: 16px; }
    .screen.active { display: block; }
    .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card.urgent { border-left: 5px solid #d32f2f; }
    .ability { background: #fff8e1; color: #ef6c00; font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-top: 10px; }
    .status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
    .status.new { background: #ffebee; color: #c62828; }
    .status.done { background: #e8f5e9; color: #2e7d32; }
    .profile-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .level { font-size: 12px; padding: 4px 10px; border-radius: 6px; }
    .level.self { background: #e8f5e9; color: #2e7d32; }
    .level.little { background: #fff8e1; color: #f9a825; }
    .level.more { background: #fff3e0; color: #ef6c00; }
    .level.full { background: #ffebee; color: #c62828; }
    #enableAlert { width: 100%; margin-bottom: 12px; padding: 14px; border: none; border-radius: 12px; background: #c62828; color: #fff; font-size: 16px; }
    .need-icon { font-size: 42px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="header">居家介护 · 家属端</div>
  <div id="home" class="screen active">
    <button id="enableAlert" onclick="CareAlert.enable()">点击开启声音提醒</button>
    <div id="needList" class="card">正在连接…</div>
  </div>
  <div id="profile" class="screen">
    <div class="card">
      <div style="font-weight:600;">张爷爷 · 生活能力画像</div>
      <div class="profile-item"><span>吃饭</span><span class="level self">自己可以</span></div>
      <div class="profile-item"><span>喝水</span><span class="level little">需要一点帮助</span></div>
      <div class="profile-item"><span>翻身</span><span class="level more">需要较多帮助</span></div>
      <div class="profile-item"><span>坐起</span><span class="level more">需要较多帮助</span></div>
      <div class="profile-item"><span>站立</span><span class="level full">完全需要帮助</span></div>
      <div class="profile-item"><span>转移</span><span class="level full">完全需要帮助</span></div>
      <div class="profile-item"><span>如厕</span><span class="level more">需要较多帮助</span></div>
      <div class="profile-item"><span>穿衣</span><span class="level more">需要较多帮助</span></div>
      <div class="profile-item"><span>洗澡</span><span class="level full">完全需要帮助</span></div>
      <div class="profile-item"><span>沟通</span><span class="level self">自己可以</span></div>
    </div>
  </div>
  <div id="records" class="screen"><div id="recordList" class="card">暂无记录</div></div>
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('home', this)">通知</button>
    <button class="tab" onclick="showTab('profile', this)">能力画像</button>
    <button class="tab" onclick="showTab('records', this)">服务记录</button>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="alert.js"></script>
  <script>
    firebase.initializeApp(window.FIREBASE_CONFIG);
    const db = firebase.database();
    function showTab(id, el) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }
    function formatTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    function abilityHtml(snap) {
      if (!snap) return '';
      return Object.keys(snap).map(k => k + '：' + snap[k]).join('<br>');
    }
    db.ref('needs').on('value', function (s) {
      const items = [];
      s.forEach(function (c) { items.push(Object.assign({id: c.key}, c.val())); });
      items.sort((a,b) => (b.created_at||0)-(a.created_at||0));
      CareAlert.check(items);
      if (!items.length) {
        document.getElementById('needList').innerHTML = '还没有新需求。';
        document.getElementById('recordList').innerHTML = '暂无记录';
        return;
      }
      document.getElementById('needList').innerHTML = items.map(n => {
        const pending = n.status === 'pending';
        return '<div class="card' + (pending ? ' urgent' : '') + '"><div class="need-icon">' + CareAlert.typeIcon(n.type) + '</div><h3>' + (n.elder_name||'张爷爷') + ' <span class="status ' + (pending?'new':'done') + '">' + (pending?'新需求':(n.status==='accepted'?'已接单':'已完成')) + '</span></h3><div>' + formatTime(n.created_at) + '</div><div>请求：<strong>' + n.type + '</strong></div><div class="ability">' + abilityHtml(n.ability_snapshot) + '</div></div>';
      }).join('');
      document.getElementById('recordList').innerHTML = items.map(n => '<div class="card">' + formatTime(n.created_at) + ' · ' + n.type + ' · ' + n.status + '</div>').join('');
    });
  </script>
</body>
</html>
