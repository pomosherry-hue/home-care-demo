<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>居家介护 - 老人端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #f5f5f5; height: 100vh; }
    .screen { display: none; height: 100dvh; padding: 16px; flex-direction: column; }
    .screen.active { display: flex; }
    .header { text-align: center; padding: 12px 0 16px; font-size: 22px; font-weight: 600; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; }
    .big-btn { background: #fff; border: none; border-radius: 20px; padding: 16px 8px; font-size: 20px; box-shadow: 0 4px 12px rgba(0,0,0,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    .big-btn .icon { font-size: 36px; }
    .big-btn.red { background: #ffebee; color: #c62828; }
    .big-btn.blue { background: #e3f2fd; color: #1565c0; }
    .big-btn.green { background: #e8f5e9; color: #2e7d32; }
    .big-btn.orange { background: #fff3e0; color: #ef6c00; }
    .big-btn.purple { background: #f3e5f5; color: #7b1fa2; }
    .emergency { margin-top: 12px; background: #b71c1c; color: #fff; border: none; border-radius: 16px; padding: 18px; font-size: 20px; }
    .choice { flex: 1; border: none; border-radius: 20px; font-size: 22px; font-weight: 700; margin-bottom: 14px; }
    .choice.family { background: #ef6c00; color: #fff; }
    .choice.sos { background: #c62828; color: #fff; }
    .note { text-align: center; color: #666; margin-bottom: 12px; }
    .body-map { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-y: auto; }
    .body-btn { width: 85%; padding: 14px; font-size: 20px; border-radius: 14px; border: 2px solid #ddd; background: #fff; }
    .btn-back, .enter { padding: 16px; font-size: 18px; border: none; border-radius: 14px; }
    .btn-back { background: #eee; margin-top: 12px; }
    .enter { background: #1976d2; color: #fff; width: 100%; }
    input { width: 100%; padding: 16px; font-size: 20px; border: 1px solid #ddd; border-radius: 12px; margin: 12px 0; }
    .success { text-align: center; margin: auto; }
  </style>
</head>
<body>
  <div id="gate" class="screen active">
    <div class="header">输入老人电话</div>
    <p class="note">只要输一次，以后会记住</p>
    <input id="gatePhone" type="tel" placeholder="13800000000">
    <button class="enter" onclick="enterFamily()">进入</button>
  </div>
  <div id="home" class="screen">
    <div class="header">需要什么？</div>
    <div class="btn-grid">
      <button class="big-btn red" onclick="goTo('body')"><span class="icon">😣</span>疼</button>
      <button class="big-btn blue" onclick="sendDirect('喝水')"><span class="icon">💧</span>喝水</button>
      <button class="big-btn green" onclick="sendDirect('翻身')"><span class="icon">🔄</span>翻身</button>
      <button class="big-btn orange" onclick="sendDirect('冷/热')"><span class="icon">🌡️</span>冷/热</button>
      <button class="big-btn purple" onclick="sendDirect('大小便')"><span class="icon">🚽</span>大小便</button>
      <button class="big-btn" onclick="sendDirect('胃管不舒服')"><span class="icon">🩺</span>胃管不舒服</button>
      <button class="big-btn" onclick="sendDirect('找家人')"><span class="icon">👨‍👩‍👧</span>找家人</button>
      <button class="big-btn" onclick="sendDirect('其他')"><span class="icon">💬</span>其他</button>
    </div>
    <button class="emergency" onclick="goTo('urgent')">需要马上帮助</button>
  </div>
  <div id="urgent" class="screen">
    <div class="header">请选一个</div>
    <p class="note">这一页不是 120。真的危险请直接打电话。</p>
    <button class="choice family" onclick="needFamilyNow()">需要家人马上来</button>
    <button class="choice sos" onclick="call120()">拨打 120</button>
    <button class="btn-back" onclick="goTo('home')">返回</button>
  </div>
  <div id="body" class="screen">
    <div class="header">哪里疼？</div>
    <div class="body-map">
      <button class="body-btn" onclick="selectBody('头')">头</button>
      <button class="body-btn" onclick="selectBody('脗子')">脗子</button>
      <button class="body-btn" onclick="selectBody('胸')">胸</button>
      <button class="body-btn" onclick="selectBody('肚子')">肚子</button>
      <button class="body-btn" onclick="selectBody('腰')">腰</button>
      <button class="body-btn" onclick="selectBody('手')">手</button>
      <button class="body-btn" onclick="selectBody('腿')">腿</button>
      <button class="body-btn" onclick="selectBody('其他')">其他</button>
    </div>
    <button class="btn-back" onclick="goTo('home')">返回</button>
  </div>
  <div id="success" class="screen">
    <div class="success">
      <div id="okIcon" style="font-size:80px">✅</div>
      <h2 id="okTitle">已发送！</h2>
      <p id="waitLine">请等一等</p>
      <p id="confirmLine"></p>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="family-bind.js"></script>
  <script>
    firebase.initializeApp(window.FIREBASE_CONFIG);
    const db = firebase.database();
    const elder = window.ELDER_DEMO;
    let phone = localStorage.getItem('elderPhone') || '';
    let currentNeedRef = null;
    let homeTimer = null;
    function goTo(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
    function backHomeSoon(ms) {
      clearTimeout(homeTimer);
      homeTimer = setTimeout(function () { goTo('home'); }, ms);
    }
    function enterFamily() {
      phone = (document.getElementById('gatePhone').value || '').replace(/\s/g, '');
      if (!phone) { alert('请输入电话'); return; }
      localStorage.setItem('elderPhone', phone);
      goTo('home');
    }
    if (phone) {
      document.getElementById('gatePhone').value = phone;
      goTo('home');
    }
    function relatedAbility(type) {
      const a = elder.ability;
      if (type.indexOf('疼') >= 0) return { 翻身: a['翻身'], 沟通: a['沟通'] };
      if (type === '喝水') return { 喝水: a['喝水'] };
      return { 沟通: a['沟通'] };
    }
    function call120() { location.href = 'tel:120'; }
    function needFamilyNow() {
      sendNeed('需要家人马上来').then(function () {
        db.ref(FamilyBind.path(phone)).once('value').then(function (s) {
          const b = s.val() || {};
          if (b.familyPhone) location.href = 'tel:' + b.familyPhone;
        });
      });
    }
    function openFamilySms(type) {
      db.ref(FamilyBind.path(phone)).once('value').then(function (s) {
        const b = s.val() || {};
        const to = b.familyPhone || b.caregiverPhone;
        if (!to) return;
        location.href = 'sms:' + to + '?body=' + encodeURIComponent((b.elderName || '老人') + '需要帮助：' + type);
      });
    }
    function watchNeed(id) {
      if (currentNeedRef) currentNeedRef.off();
      currentNeedRef = db.ref('needs/' + id);
      currentNeedRef.on('value', function (s) {
        const n = s.val() || {};
        if (n.confirm_text) {
          document.getElementById('okTitle').innerText = n.confirm_text;
          document.getElementById('waitLine').innerText = '您不用再操作。';
          backHomeSoon(8000);
        }
      });
    }
    function sendNeed(type) {
      if (!phone) { goTo('gate'); return Promise.reject(); }
      const ref = db.ref('needs').push();
      return ref.set({
        id: ref.key, elder_id: elder.id, elder_name: elder.name, elder_phone: phone,
        address: elder.address, type: type, status: 'pending', created_at: Date.now(),
        ability_snapshot: relatedAbility(type), confirm_text: '', confirm_detail: ''
      }).then(function () {
        watchNeed(ref.key);
        document.getElementById('okTitle').innerText = '已通知家人';
        document.getElementById('waitLine').innerText = '这不是 120。';
        goTo('success');
        backHomeSoon(20000);
        if (type !== '需要家人马上来') openFamilySms(type);
      });
    }
    function selectBody(part) { sendNeed(part + '部疼痛'); }
    function sendDirect(need) { sendNeed(need); }
  </script>
</body>
</html>
