<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>北京居家失能老人介护平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #e3f2fd 0%, #f5f5f5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #1565c0;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      font-size: 15px;
      color: #666;
      margin-bottom: 40px;
      text-align: center;
      line-height: 1.5;
    }
    .role-btn {
      width: 100%;
      max-width: 340px;
      background: white;
      border: none;
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      text-decoration: none;
      color: #333;
      transition: transform 0.15s;
    }
    .role-btn:active { transform: scale(0.97); }
    .role-btn .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .role-btn.elder .icon { background: #e3f2fd; }
    .role-btn.family .icon { background: #e8f5e9; }
    .role-btn.care .icon { background: #fff3e0; }
    .role-btn .text {
      flex: 1;
    }
    .role-btn .text h3 {
      font-size: 18px;
      margin-bottom: 4px;
    }
    .role-btn .text p {
      font-size: 13px;
      color: #888;
    }
    .role-btn .arrow {
      font-size: 20px;
      color: #bbb;
    }
    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo">居家介护平台</div>
  <div class="subtitle">
    让每一位老人都能被听见<br>
    不是让老人学会用互联网<br>
    而是让互联网学会理解老人
  </div>

  <a class="role-btn elder" href="elder-app.html">
    <div class="icon">🧓</div>
    <div class="text">
      <h3>老人端</h3>
      <p>大按钮表达需求，两下完成</p>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="role-btn family" href="family-app.html">
    <div class="icon">👨‍👩‍👧</div>
    <div class="text">
      <h3>家属端</h3>
      <p>实时通知 · 能力画像 · 服务记录</p>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="role-btn care" href="caregiver-app.html">
    <div class="icon">👩‍⚕️</div>
    <div class="text">
      <h3>护理员端</h3>
      <p>接单 · 能力提示 · 完成服务</p>
    </div>
    <div class="arrow">›</div>
  </a>

  <div class="footer">
    北京居家失能老人介护平台 · 演示版
  </div>
</body>
</html>
