<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安装家属端</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 24px; line-height: 1.6; color: #222; }
    h1 { font-size: 22px; }
    .step { background: #f5f5f5; border-radius: 12px; padding: 16px; margin: 12px 0; }
    a.btn { display: block; text-align: center; background: #1976d2; color: #fff; text-decoration: none; padding: 14px; border-radius: 12px; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>将家属端装到安卓桌面</h1>
  <p>这是第一步测试版：用手机浏览器加到主屏幕，看起来像 App。</p>
  <a class="btn" href="family-app.html">打开家属端</a>
  <div class="step"><b>1.</b> 用安卓手机 Chrome 打开家属端</div>
  <div class="step"><b>2.</b> 点右上角 ⋮ 或菜单</div>
  <div class="step"><b>3.</b> 选「添加到主屏幕」 / 「安装应用」</div>
  <div class="step"><b>4.</b> 回桌面点图标打开，再点「开启声音提醒」</div>
  <p>真正锁屏推送还要接 Firebase 云消息，下一步再做。现在先让家属端像一个独立 App 一样坐在桌面上。</p>
</body>
</html>
